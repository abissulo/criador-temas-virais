<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Criador de Temas Virais</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html.theme-dark {
  --bg:#060608;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --glass-border-h:rgba(255,255,255,0.16);--text:#f0ede8;--muted:rgba(240,237,232,0.45);
  --dim:rgba(240,237,232,0.22);--g1:#b8f050;--g2:#50d4f5;--r:14px;--f:'Plus Jakarta Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(184,240,80,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(184,240,80,0.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(184,240,80,0.07),transparent 70%);top:-100px;left:-100px;}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(80,212,245,0.05),transparent 70%);bottom:-80px;right:-80px;}

.card{
  position:relative;z-index:1;width:100%;max-width:420px;margin:24px;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;
  padding:40px 36px;backdrop-filter:blur(20px);
  animation:fadeUp .6s ease both;
}
.logo{text-align:center;margin-bottom:32px;}
.logo h1{
  font-size:28px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#f0ede8,#b8f050,#50d4f5);
  background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:gradShift 4s ease infinite;
}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo p{font-size:13px;color:var(--muted);margin-top:6px;}

.tabs{display:flex;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:10px;padding:3px;margin-bottom:24px;}
.tab{flex:1;font-family:var(--f);font-size:13px;font-weight:600;background:transparent;border:none;color:var(--dim);padding:8px;border-radius:8px;cursor:pointer;transition:all .2s;}
.tab.active{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--glass-border);}

.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
input[type=email],input[type=password],input[type=text]{
  width:100%;background:rgba(255,255,255,.04);border:1px solid var(--glass-border);
  border-radius:var(--r);padding:13px 16px;font-family:var(--f);font-size:14px;
  color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:rgba(240,237,232,.2);}
input:focus{border-color:rgba(184,240,80,.4);box-shadow:0 0 0 3px rgba(184,240,80,.07);}

.btn-submit{
  position:relative;overflow:hidden;width:100%;
  font-family:var(--f);font-size:14px;font-weight:700;
  background:var(--g1);color:#060608;border:none;border-radius:var(--r);
  padding:14px;cursor:pointer;margin-top:8px;
  transition:transform .15s,box-shadow .2s;
}
.btn-submit::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-100%);transition:transform .5s;}
.btn-submit:hover::after{transform:translateX(100%);}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(184,240,80,.3);}
.btn-submit:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--dim);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--glass-border);}

.btn-google{
  position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--f);font-size:14px;font-weight:600;
  background:var(--glass);color:var(--text);border:1px solid var(--glass-border);
  border-radius:var(--r);padding:13px;cursor:pointer;backdrop-filter:blur(8px);
  transition:border-color .2s,background .2s;
}
.btn-google:hover{border-color:var(--glass-border-h);background:rgba(255,255,255,.07);}
.btn-google svg{width:18px;height:18px;flex-shrink:0;}

.msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
.msg.error{background:rgba(220,60,60,.1);border:1px solid rgba(220,60,60,.2);color:#f08080;}
.msg.success{background:rgba(60,180,60,.1);border:1px solid rgba(60,180,60,.2);color:#80e080;}
.msg.info{background:rgba(80,160,240,.1);border:1px solid rgba(80,160,240,.2);color:#80c0f5;}
.msg.show{display:block;}

.pending-box{
  text-align:center;padding:24px 0;display:none;
}
.pending-box.show{display:block;animation:fadeUp .4s ease both;}
.pending-icon{font-size:40px;margin-bottom:12px;}
.pending-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px;}
.pending-desc{font-size:13px;color:var(--muted);line-height:1.65;}
.pending-email{
  display:inline-block;margin-top:12px;font-size:12px;font-weight:700;
  color:var(--g1);background:rgba(184,240,80,.1);border:1px solid rgba(184,240,80,.2);
  padding:4px 12px;border-radius:100px;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

html.theme-light body { background: var(--bg); }
html.theme-light .card { background: rgba(255,255,255,.9); border-color: rgba(0,0,0,.1); box-shadow: 0 4px 32px rgba(0,0,0,.08); }
html.theme-light input { background: rgba(0,0,0,.04) !important; border-color: rgba(0,0,0,.12) !important; color: var(--text) !important; }
html.theme-light .btn-google { background: rgba(0,0,0,.04); border-color: rgba(0,0,0,.12); color: var(--text); }
@media(max-width:640px){.card{margin:16px !important;padding:28px 20px !important;}}

</style>
<script>(function(){var t=localStorage.getItem("ctv-theme")||"light";document.documentElement.className="theme-"+t;})();</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="logo">
    <h1>Criador de Temas Virais</h1>
    <p>Faça login para acessar a plataforma</p>
  </div>

  <div id="msg" class="msg"></div>

  <!-- FORM SECTION -->
  <div id="form-section">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <div id="form-login">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-pass" placeholder="••••••••"/>
      </div>
      <button class="btn-submit" id="btn-login" onclick="doLogin()">Entrar →</button>
    </div>

    <!-- SIGNUP -->
    <div id="form-signup" style="display:none;">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="signup-name" placeholder="Seu nome"/>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="signup-email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="signup-pass" placeholder="Mínimo 6 caracteres"/>
      </div>
      <button class="btn-submit" id="btn-signup" onclick="doSignup()">Criar conta →</button>
    </div>

    <div class="divider">ou</div>
    <button class="btn-google" onclick="doGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar com Google
    </button>
  </div>

  <!-- PENDING BOX -->
  <div class="pending-box" id="pending-box">
    <div class="pending-icon">⏳</div>
    <div class="pending-title">Cadastro recebido!</div>
    <div class="pending-desc">Sua conta foi criada. Assim que o pagamento for confirmado, você receberá acesso por e-mail.</div>
    <div class="pending-email" id="pending-email-label"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL   = 'https://ezrhzvrgndvnnslrfxge.supabase.co';
const SUPABASE_ANON  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cmh6dnJnbmR2bm5zbHJmeGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mzk3MDcsImV4cCI6MjA4OTUxNTcwN30.0m57LLbVHiM8uGml5vYGXfQFwRQllXqyCMzAg8IqzXw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function switchTab(t){
  document.getElementById('tab-login').classList.toggle('active',t==='login');
  document.getElementById('tab-signup').classList.toggle('active',t==='signup');
  document.getElementById('form-login').style.display=t==='login'?'block':'none';
  document.getElementById('form-signup').style.display=t==='signup'?'block':'none';
  hideMsg();
}

function showMsg(txt,type='error'){
  const el=document.getElementById('msg');
  el.textContent=txt;el.className=`msg ${type} show`;
}
function hideMsg(){document.getElementById('msg').className='msg';}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showMsg('Preencha e-mail e senha.');return;}
  const btn=document.getElementById('btn-login');
  btn.disabled=true;btn.textContent='Entrando...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showMsg('E-mail ou senha incorretos.');btn.disabled=false;btn.textContent='Entrar →';return;}
  await checkAndRedirect(data.user);
  btn.disabled=false;btn.textContent='Entrar →';
}

async function doSignup(){
  const name=document.getElementById('signup-name').value.trim();
  const email=document.getElementById('signup-email').value.trim();
  const pass=document.getElementById('signup-pass').value;
  if(!name||!email||!pass){showMsg('Preencha todos os campos.');return;}
  if(pass.length<6){showMsg('Senha deve ter pelo menos 6 caracteres.');return;}
  const btn=document.getElementById('btn-signup');
  btn.disabled=true;btn.textContent='Criando conta...';
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error){showMsg(error.message);btn.disabled=false;btn.textContent='Criar conta →';return;}
  // Insere perfil como inativo (aguardando pagamento)
  await sb.from('profiles').upsert({id:data.user.id,email,full_name:name,ativo:false});
  document.getElementById('form-section').style.display='none';
  document.getElementById('pending-email-label').textContent=email;
  document.getElementById('pending-box').classList.add('show');
  btn.disabled=false;btn.textContent='Criar conta →';
}

async function doGoogle(){
  await sb.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.origin+'/auth/callback'}
  });
}

async function checkAndRedirect(user){
  if(!user){showMsg('Erro ao verificar usuário.');return;}
  const {data}=await sb.from('profiles').select('ativo').eq('id',user.id).single();
  if(data?.ativo){
    window.location.href='/';
  } else {
    await sb.auth.signOut();
    showMsg('Sua conta ainda não foi ativada. Aguarde a confirmação do pagamento.','info');
  }
}

// Verifica se já está logado
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await checkAndRedirect(session.user);
})();

// Enter nos inputs
['login-email','login-pass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();}));
['signup-name','signup-email','signup-pass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doSignup();}));

// Particles
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<40;i++)pts.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.2+.4,a:Math.random()});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(184,240,80,${p.a*.3})`;ctx.fill();});
    requestAnimationFrame(draw);
  }
  draw();
})();

function toggleTheme(){
  var cur=document.documentElement.classList.contains('theme-dark')?'dark':'light';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.className='theme-'+next;
  localStorage.setItem('ctv-theme',next);
  updateDrawerTheme();
}
function openDrawer(){}
function closeDrawer(){}
function updateDrawerTheme(){
  var isDark=document.documentElement.classList.contains('theme-dark');
  var btn=document.getElementById('theme-toggle-btn');
  if(btn) btn.textContent=isDark?'\u2600\ufe0f':'\uD83C\uDF19';
}

</script>
<button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme();updateDrawerTheme()" title="Alternar tema" style="position:fixed;top:14px;right:14px;z-index:100;"></button>
<script>if(document.getElementById("theme-toggle-btn"))document.getElementById("theme-toggle-btn").textContent=document.documentElement.classList.contains("theme-dark")?"\u2600\ufe0f":"\uD83C\uDF19";</script>
</body>
</html>
