<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico — Criador de Temas Virais</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html.theme-dark {
  --bg:#060608;--glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);--glass-border-h:rgba(255,255,255,.15);
  --text:#f0ede8;--muted:rgba(240,237,232,.45);--dim:rgba(240,237,232,.22);
  --g1:#2ECFB3;--g2:#50d4f5;--g3:#f050a4;--g4:#f0a050;--r:13px;--f:'Plus Jakarta Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(46,207,179,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(46,207,179,.018) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(6,6,8,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);}
.topbar-logo{font-size:13px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-link{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--glass-border);border-radius:8px;transition:all .2s;}
.topbar-link:hover{color:var(--text);border-color:var(--glass-border-h);}
.topbar-link.active{color:var(--g1);border-color:rgba(46,207,179,.25);background:rgba(46,207,179,.05);}
.btn-logout{font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.04);color:rgba(240,237,232,.4);border:1px solid var(--glass-border);border-radius:8px;padding:6px 12px;cursor:pointer;}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:64px 24px 80px;}
.page-header{margin-bottom:28px;}
.page-header h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em;margin-bottom:5px;}
.page-header h1 em{font-style:normal;color:var(--g1);}
.page-header p{font-size:14px;color:var(--muted);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.stat{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);padding:13px 16px;backdrop-filter:blur(8px);}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:22px;font-weight:800;color:var(--text);}
.stat-val.green{color:var(--g1);}
.filters-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-pill{font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 13px;border-radius:100px;background:var(--glass);border:1px solid var(--glass-border);color:var(--muted);cursor:pointer;transition:all .2s;}
.filter-pill:hover{color:var(--text);border-color:var(--glass-border-h);}
.filter-pill.active{background:rgba(46,207,179,.09);border-color:rgba(46,207,179,.28);color:var(--g1);}
.search-input{flex:1;min-width:180px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);padding:8px 13px;font-family:var(--f);font-size:13px;color:var(--text);outline:none;backdrop-filter:blur(8px);}
.search-input:focus{border-color:rgba(46,207,179,.35);}
.search-input::placeholder{color:var(--dim);}
.hist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.hist-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px);}
.hist-card:hover{border-color:var(--glass-border-h);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.hc-top{height:2px;}
.fmt-reels .hc-top{background:linear-gradient(90deg,#f0a050,#f06060);}
.fmt-carrossel .hc-top{background:linear-gradient(90deg,var(--g2),#50f5d4);}
.fmt-post .hc-top{background:linear-gradient(90deg,var(--g1),#a0f050);}
.hc-body{padding:14px;}
.hc-meta{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
.hc-fmt{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px;}
.fmt-reels .hc-fmt{color:#f0a050;background:rgba(240,160,80,.1);border:1px solid rgba(240,160,80,.2);}
.fmt-carrossel .hc-fmt{color:var(--g2);background:rgba(80,212,245,.08);border:1px solid rgba(80,212,245,.18);}
.fmt-post .hc-fmt{color:var(--g1);background:rgba(46,207,179,.08);border:1px solid rgba(46,207,179,.18);}
.hc-cat{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}
.hc-tema{font-size:13px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:4px;}
.hc-nicho{font-size:11px;color:var(--muted);}
.hc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:9px;border-top:1px solid var(--glass-border);}
.hc-date{font-size:10px;color:var(--dim);}
.hc-tom{font-size:10px;color:var(--g4);}
.btn-del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:4px;transition:color .15s;}
.btn-del:hover{color:#f06060;}
.empty{text-align:center;padding:56px 24px;color:var(--dim);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty h3{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.empty p{font-size:13px;line-height:1.6;}
.loading-state{text-align:center;padding:48px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;}
.spin{width:18px;height:18px;border:2px solid rgba(46,207,179,.1);border-top-color:var(--g1);border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
.modal{background:#0f0f14;border:1px solid var(--glass-border);border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;}
.modal-title{font-size:17px;font-weight:800;color:var(--text);line-height:1.3;}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;}
.modal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.modal-tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:var(--glass);border:1px solid var(--glass-border);color:var(--muted);}
.msec{margin-bottom:14px;}
.msec-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.msec-label::after{content:'';flex:1;height:1px;background:var(--glass-border);}
.mbox{background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.7;}
.mbox.hl{border-left:2px solid var(--g1);color:var(--text);font-weight:500;}
.cena-i{border-bottom:1px solid rgba(255,255,255,.05);padding:5px 0;font-size:12px;color:var(--muted);}
.cena-i:last-child{border-bottom:none;}
.cena-n{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:2px;}
.hash{font-size:12px;color:var(--g2);margin-top:4px;}
.modal-actions{display:flex;gap:9px;margin-top:18px;padding-top:14px;border-top:1px solid var(--glass-border);}
.btn-copy-all{flex:1;font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--g1);color:#060608;border:none;border-radius:var(--r);padding:11px;cursor:pointer;}
.btn-copy-all:hover{opacity:.88;}
.btn-close-m{font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--glass);color:var(--muted);border:1px solid var(--glass-border);border-radius:var(--r);padding:11px 15px;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--g1);color:#060608;font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;padding:10px 20px;border-radius:100px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:200;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:640px){.hist-grid{grid-template-columns:1fr 1fr;}.stats{grid-template-columns:1fr 1fr;}}
@media(max-width:400px){.hist-grid{grid-template-columns:1fr;}.stats{grid-template-columns:1fr;}}

/* ── TOPBAR (overrides responsive.css for clarity) ── */
.topbar { position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:rgba(6,6,8,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);gap:12px; }
html.theme-light .topbar { background:rgba(244,243,240,.95); }
.topbar-logo { font-size:13px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;flex-shrink:0; }
.topbar-right { display:flex;align-items:center;gap:7px;flex-shrink:0; }
.topbar-user { font-size:12px;color:var(--muted);white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis; }
.topbar-link { font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:5px 10px;border:1px solid var(--glass-border);border-radius:7px;transition:all .2s;white-space:nowrap; }
.topbar-link:hover { color:var(--text);border-color:var(--glass-border-h); }
.topbar-link.active { color:var(--g2);border-color:rgba(80,212,245,.3);background:rgba(80,212,245,.06); }
.topbar-link.tl-hist { color:rgba(46,207,179,.8);border-color:rgba(46,207,179,.25);background:rgba(46,207,179,.05); }
.topbar-link.tl-pdf { color:rgba(240,80,164,.8);border-color:rgba(240,80,164,.2);background:rgba(240,80,164,.04); }
.btn-logout { font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.04);color:rgba(240,237,232,.4);border:1px solid var(--glass-border);border-radius:7px;padding:5px 10px;cursor:pointer; }
html.theme-light .btn-logout { color:rgba(0,0,0,.4);background:rgba(0,0,0,.04); }
/* Hide on mobile */
@media(max-width:640px) {
  .topbar-link, .topbar-user, .btn-logout, .theme-toggle { display:none!important; }
  .hamburger { display:flex!important; }
  .topbar { padding:0 14px; }
}

</style>
<script>(function(){var t=localStorage.getItem("ctv-theme")||"light";document.documentElement.className="theme-"+t;})();</script>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-logo">Criador de Temas Virais</a>
  <div class="topbar-right">
    <span id="user-name" class="topbar-user"></span>
    <a href="/" class="topbar-link ">← Criar</a>
    <a href="/historico" class="topbar-link active">Histórico</a>
    <a href="/calendario" class="topbar-link ">Calendário</a>
    <a href="/exportar" class="topbar-link tl-pdf">↓ PDF</a>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme();updateDrawerTheme()" title="Alternar tema"></button>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
    <button class="hamburger" onclick="openDrawer()" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</div>

<div class="wrap">
  <div class="page-header">
    <h1>Seu <em>Histórico</em></h1>
    <p>Todos os conteúdos que você salvou — acesse, copie e reutilize.</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Total salvo</div><div class="stat-val green" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Nichos</div><div class="stat-val" id="stat-nichos">—</div></div>
    <div class="stat"><div class="stat-label">Último</div><div class="stat-val" id="stat-ultimo" style="font-size:13px;padding-top:5px;">—</div></div>
  </div>
  <div class="filters-bar">
    <input type="text" class="search-input" id="search" placeholder="Buscar por tema, nicho..." oninput="renderCards()"/>
    <button class="filter-pill active" onclick="setFmt('todos',this)">Todos</button>
    <button class="filter-pill" onclick="setFmt('reels',this)">▶ Reels</button>
    <button class="filter-pill" onclick="setFmt('carrossel',this)">☰ Carrossel</button>
    <button class="filter-pill" onclick="setFmt('post',this)">◻ Post</button>
  </div>
  <div class="filters-bar" id="client-filters" style="display:none;">
    <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Cliente:</span>
    <div id="client-pills" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>
  <div id="hist-container"><div class="loading-state"><div class="spin"></div><span>Carregando...</span></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL='https://ezrhzvrgndvnnslrfxge.supabase.co';
var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cmh6dnJnbmR2bm5zbHJmeGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mzk3MDcsImV4cCI6MjA4OTUxNTcwN30.0m57LLbVHiM8uGml5vYGXfQFwRQllXqyCMzAg8IqzXw';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
var allItems=[],fmtAtivo='todos',clienteAtivo='todos';

(async function(){
  var session=(await sb.auth.getSession()).data.session;
  if(!session){window.location.href='/login.html';return;}
  var prof=(await sb.from('profiles').select('ativo,full_name').eq('id',session.user.id).single()).data;
  if(!prof||!prof.ativo){await sb.auth.signOut();window.location.href='/login.html?pendente=1';return;}
  var nm=document.getElementById('user-name');
  if(nm) nm.textContent=prof.full_name||session.user.email;
  var res=await sb.from('historico').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});
  if(res.error){document.getElementById('hist-container').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Erro ao carregar</h3><p>Tente recarregar a página.</p></div>';return;}
  allItems=res.data||[];
  updateStats();renderClientPills();renderCards();
})();

async function doLogout(){await sb.auth.signOut();window.location.href='/login.html';}

function renderClientPills(){
  var clientes=['todos',...new Set(allItems.map(function(i){return i.cliente||'';}).filter(Boolean))];
  var bar=document.getElementById('client-filters');
  var pills=document.getElementById('client-pills');
  if(clientes.length<=1){if(bar)bar.style.display='none';return;}
  if(bar)bar.style.display='flex';
  if(!pills)return;
  var pillHtml='<button class="filter-pill'+(clienteAtivo==='todos'?' active':'')+'" ';
  pillHtml+='onclick="setCliente(this)">Todos</button>';
  clientes.filter(function(c){return c!=='todos';}).forEach(function(cl){
    pillHtml+='<button class="filter-pill'+(clienteAtivo===cl?' active':'')+'" ';
    pillHtml+='data-cliente="'+cl+'" onclick="setCliente(this)">'+cl+'</button>';
  });
  pills.innerHTML=pillHtml;
}

function setCliente(btn){
  clienteAtivo=btn.getAttribute('data-cliente')||'todos';
  document.querySelectorAll('#client-pills .filter-pill').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderCards();
}

function updateStats(){
  document.getElementById('stat-total').textContent=allItems.length;
  document.getElementById('stat-nichos').textContent=new Set(allItems.map(function(i){return i.nicho;})).size;
  document.getElementById('stat-ultimo').textContent=allItems.length>0?new Date(allItems[0].created_at).toLocaleDateString('pt-BR'):'—';
}

function setFmt(fmt,btn){
  fmtAtivo=fmt;
  document.querySelectorAll('.filter-pill').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderCards();
}

function renderCards(){
  var search=document.getElementById('search').value.toLowerCase();
  var items=allItems.filter(function(item){
    var mFmt=fmtAtivo==='todos'||item.formato===fmtAtivo;
    var mSearch=!search||(item.tema||'').toLowerCase().indexOf(search)>-1||(item.nicho||'').toLowerCase().indexOf(search)>-1||(item.cliente||'').toLowerCase().indexOf(search)>-1;
    var mClient=clienteAtivo==='todos'||(item.cliente||'')===clienteAtivo;
    return mFmt&&mSearch&&mClient;
  });
  var el=document.getElementById('hist-container');
  if(!items.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📂</div><h3>'+(allItems.length===0?'Nenhum conteúdo salvo ainda':'Sem resultados')+'</h3><p>'+(allItems.length===0?'Gere um conteúdo e clique em "✦ Salvar no histórico".':'Tente outro termo ou filtro.')+'</p></div>';
    return;
  }
  el.innerHTML='<div class="hist-grid">'+items.map(function(item){
    var fc='fmt-'+(item.formato||'post');
    var fl=item.formato==='reels'?'▶ Reels':item.formato==='carrossel'?'☰ Carrossel':'◻ Post';
    var dt=new Date(item.created_at).toLocaleDateString('pt-BR');
    return '<div class="hist-card '+fc+'" onclick="abrirModal(\''+item.id+'\')"><div class="hc-top"></div><div class="hc-body"><div class="hc-meta"><span class="hc-fmt">'+fl+'</span><span class="hc-cat">'+(item.categoria||'')+'</span></div><div class="hc-tema">'+(item.tema||'')+'</div><div class="hc-nicho">'+(item.nicho||'')+'</div><div class="hc-footer"><span class="hc-date">'+dt+'</span><span class="hc-tom">'+(item.tom||'')+'</span><button class="btn-del" onclick="event.stopPropagation();deletar(\''+item.id+'\')">✕</button></div></div></div>';
  }).join('')+'</div>';
}

function abrirModal(id){
  var item=allItems.find(function(i){return i.id===id;});
  if(!item) return;
  var c=item.conteudo||{},fmt=item.formato,body='';
  var est=item.estrutura||{};
  if(est.titulo||(est.fw_steps&&est.fw_steps.length)){
    var stepsHtml=(est.fw_steps||[]).map(function(s){
      return '<div style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);">'
        +'<span style="font-size:12px;font-weight:700;color:var(--text);">'+s.label+':</span> '
        +'<span style="font-size:12px;color:var(--muted);">'+s.texto+'</span></div>';
    }).join('');
    body+='<div class="msec"><div class="msec-label">Estrutura do conteúdo</div>'
      +'<div class="mbox" style="border-left:2px solid rgba(80,212,245,.4);">'
      +(est.titulo?'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;">'+est.titulo+'</div>':'')
      +stepsHtml+'</div></div>';
  }
  if(fmt==='reels'){
    body+='<div class="msec"><div class="msec-label">Hook</div><div class="mbox hl">'+(c.hook||'')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Cenas</div><div class="mbox">'+(c.cenas||[]).map(function(cn){return '<div class="cena-i"><div class="cena-n">Cena '+cn.num+'</div>'+cn.texto+'</div>';}).join('')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">CTA</div><div class="mbox">'+(c.cta||'')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Legenda</div><div class="mbox">'+(c.legenda||'')+'<div class="hash">'+(c.hashtags||'')+'</div></div></div>';
  } else if(fmt==='carrossel'){
    body+='<div class="msec"><div class="msec-label">Capa</div><div class="mbox hl">'+(c.capa||'')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Slides</div><div class="mbox">'+(c.slides||[]).map(function(s,i){return '<div class="cena-i"><div class="cena-n">Slide '+(i+2)+'</div>'+s+'</div>';}).join('')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Legenda</div><div class="mbox">'+(c.legenda||'')+'<div class="hash">'+(c.hashtags||'')+'</div></div></div>';
  } else {
    body+='<div class="msec"><div class="msec-label">Imagem</div><div class="mbox hl">'+(c.imagem||'')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Subtítulo</div><div class="mbox">'+(c.subtexto||'')+'</div></div>';
    body+='<div class="msec"><div class="msec-label">Legenda</div><div class="mbox">'+(c.legenda||'')+'<div class="hash">'+(c.hashtags||'')+'</div></div></div>';
  }
  var fl=fmt==='reels'?'▶ Reels':fmt==='carrossel'?'☰ Carrossel':'◻ Post';
  var dt=new Date(item.created_at).toLocaleDateString('pt-BR');
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal-overlay" id="modal-ov" onclick="if(event.target.id===\'modal-ov\')fecharModal()">'
    +'<div class="modal"><div class="modal-header"><div class="modal-title">'+(item.tema||'')+'</div><button class="modal-close" onclick="fecharModal()">✕</button></div>'
    +'<div class="modal-meta"><span class="modal-tag">'+fl+'</span><span class="modal-tag">'+(item.nicho||'')+'</span><span class="modal-tag">'+(item.categoria||'')+'</span><span class="modal-tag">'+(item.framework||'')+'</span><span class="modal-tag" style="color:var(--g4)">'+(item.tom||'')+'</span><span class="modal-tag">'+dt+'</span></div>'
    +body
    +'<div class="modal-actions"><button class="btn-copy-all" onclick="copiarTudo(\''+id+'\')">⎘ Copiar tudo</button><button class="btn-close-m" onclick="fecharModal()">Fechar</button></div>'
    +'</div></div>');
}

function fecharModal(){var m=document.getElementById('modal-ov');if(m)m.remove();}

function copiarTudo(id){
  var item=allItems.find(function(i){return i.id===id;});
  if(!item) return;
  var c=item.conteudo||{},fmt=item.formato;
  var lines=[(fmt==='reels'?'REELS':fmt==='carrossel'?'CARROSSEL':'POST')+' | '+item.nicho+' | '+item.tema,'Framework: '+(item.framework||'')+' | Tom: '+(item.tom||''),''];
  if(fmt==='reels'){lines.push('HOOK: '+(c.hook||''),'');(c.cenas||[]).forEach(function(cn){lines.push('Cena '+cn.num+': '+cn.texto);});lines.push('','CTA: '+(c.cta||''),'','Legenda: '+(c.legenda||''),(c.hashtags||''));}
  else if(fmt==='carrossel'){lines.push('Capa: '+(c.capa||''));(c.slides||[]).forEach(function(s,i){lines.push('Slide '+(i+2)+': '+s);});lines.push('','Legenda: '+(c.legenda||''),(c.hashtags||''));}
  else{lines.push('Imagem: '+(c.imagem||''),'Subtítulo: '+(c.subtexto||''),'','Legenda: '+(c.legenda||''),(c.hashtags||''));}
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('Copiado!');});
}

async function deletar(id){
  if(!confirm('Excluir este conteúdo?')) return;
  var res=await sb.from('historico').delete().eq('id',id);
  if(!res.error){allItems=allItems.filter(function(i){return i.id!==id;});updateStats();renderCards();showToast('Excluído.');}
}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
</script>

function toggleTheme(){
  var cur=document.documentElement.classList.contains('theme-dark')?'dark':'light';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.className='theme-'+next;
  localStorage.setItem('ctv-theme',next);
  updateDrawerTheme();
}
function updateDrawerTheme(){
  var isDark=document.documentElement.classList.contains('theme-dark');
  var btn=document.getElementById('theme-toggle-btn');
  var icon=document.getElementById('drawer-theme-icon');
  var lbl=document.getElementById('drawer-theme-label');
  if(btn) btn.textContent=isDark?'\u2600\ufe0f':'\uD83C\uDF19';
  if(icon) icon.textContent=isDark?'\u2600\ufe0f':'\uD83C\uDF19';
  if(lbl) lbl.textContent=isDark?'Tema claro':'Tema escuro';
}
function openDrawer(){
  var d=document.getElementById('mobile-drawer');
  var o=document.getElementById('drawer-overlay');
  if(d) d.classList.add('open');
  if(o) o.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  var d=document.getElementById('mobile-drawer');
  var o=document.getElementById('drawer-overlay');
  if(d) d.classList.remove('open');
  if(o) o.classList.remove('open');
  document.body.style.overflow='';
}

</script>
