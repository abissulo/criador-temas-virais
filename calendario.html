<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário Editorial — Criador de Temas Virais</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060608;--glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);
  --glass-border-h:rgba(255,255,255,.15);--text:#f0ede8;--muted:rgba(240,237,232,.45);
  --dim:rgba(240,237,232,.22);--g1:#b8f050;--g2:#50d4f5;--g3:#f050a4;--g4:#f0a050;
  --r:13px;--f:'Plus Jakarta Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(184,240,80,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(184,240,80,.015) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0;}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(6,6,8,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);}
.topbar-logo{font-size:13px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.topbar-right{display:flex;align-items:center;gap:9px;}
.tl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--glass-border);border-radius:8px;transition:all .2s;}
.tl:hover{color:var(--text);border-color:var(--glass-border-h);}
.tl.active{color:var(--g2);border-color:rgba(80,212,245,.25);background:rgba(80,212,245,.05);}
.tl.hist{color:rgba(184,240,80,.7);border-color:rgba(184,240,80,.2);background:rgba(184,240,80,.04);}
.btn-logout{font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.04);color:rgba(240,237,232,.4);border:1px solid var(--glass-border);border-radius:8px;padding:6px 12px;cursor:pointer;}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:88px 24px 80px;}

/* HEADER */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.cal-title{font-size:clamp(22px,4vw,36px);font-weight:800;letter-spacing:-.02em;}
.cal-title em{font-style:normal;color:var(--g2);}
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-month-label{font-size:16px;font-weight:700;min-width:160px;text-align:center;}
.btn-nav{font-family:var(--f);font-size:13px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border);color:var(--muted);border-radius:var(--r);padding:8px 14px;cursor:pointer;transition:all .2s;}
.btn-nav:hover{color:var(--text);border-color:var(--glass-border-h);}
.btn-today{font-family:var(--f);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(80,212,245,.08);color:var(--g2);border:1px solid rgba(80,212,245,.2);border-radius:var(--r);padding:8px 14px;cursor:pointer;transition:all .2s;}
.btn-today:hover{background:rgba(80,212,245,.14);}

/* STATS */
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.cstat{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);padding:12px 16px;backdrop-filter:blur(8px);}
.cstat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.cstat-val{font-size:20px;font-weight:800;color:var(--text);}
.cstat-val.g1{color:var(--g1);}
.cstat-val.g2{color:var(--g2);}

/* CALENDAR GRID */
.cal-grid{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;backdrop-filter:blur(8px);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--glass-border);}
.cal-wd{padding:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:110px;border-right:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);padding:8px;position:relative;transition:background .2s;vertical-align:top;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day.other-month{opacity:.3;}
.cal-day.today{background:rgba(80,212,245,.04);}
.cal-day.today .day-num{color:var(--g2);background:rgba(80,212,245,.15);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.cal-day.drag-over{background:rgba(184,240,80,.06);border-color:rgba(184,240,80,.3);}
.day-num{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.day-num.today-num{color:var(--g2);}

/* EVENT CHIPS */
.event-chip{
  font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;
  margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:opacity .15s;display:flex;align-items:center;gap:4px;
}
.event-chip:hover{opacity:.8;}
.event-chip.fmt-reels{background:rgba(240,160,80,.15);color:#f0a050;border:1px solid rgba(240,160,80,.25);}
.event-chip.fmt-carrossel{background:rgba(80,212,245,.12);color:var(--g2);border:1px solid rgba(80,212,245,.22);}
.event-chip.fmt-post{background:rgba(184,240,80,.1);color:var(--g1);border:1px solid rgba(184,240,80,.2);}
.event-chip .chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.fmt-reels .chip-dot{background:#f0a050;}
.fmt-carrossel .chip-dot{background:var(--g2);}
.fmt-post .chip-dot{background:var(--g1);}
.more-chip{font-size:10px;font-weight:600;color:var(--dim);padding:2px 4px;cursor:pointer;}
.more-chip:hover{color:var(--muted);}

/* SIDEBAR — unscheduled */
.layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
.sidebar{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:16px;backdrop-filter:blur(8px);position:sticky;top:88px;}
.sidebar-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sidebar-title::after{content:'';flex:1;height:1px;background:var(--glass-border);}
.sidebar-hint{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5;}
.sidebar-items{display:flex;flex-direction:column;gap:7px;max-height:60vh;overflow-y:auto;}
.sidebar-item{
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:9px;
  padding:9px 10px;cursor:grab;transition:all .2s;user-select:none;
}
.sidebar-item:hover{border-color:var(--glass-border-h);background:rgba(255,255,255,.05);}
.sidebar-item:active{cursor:grabbing;opacity:.7;}
.sidebar-item.dragging{opacity:.4;transform:scale(.97);}
.si-fmt{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px;}
.fmt-reels .si-fmt{color:#f0a050;}
.fmt-carrossel .si-fmt{color:var(--g2);}
.fmt-post .si-fmt{color:var(--g1);}
.si-tema{font-size:12px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:2px;}
.si-nicho{font-size:11px;color:var(--muted);}
.sidebar-empty{font-size:12px;color:var(--dim);text-align:center;padding:20px 0;line-height:1.6;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#0f0f14;border:1px solid var(--glass-border);border-radius:16px;max-width:480px;width:100%;padding:24px;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;}
.modal-title{font-size:16px;font-weight:800;color:var(--text);line-height:1.3;}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}
.modal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.modal-tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:var(--glass);border:1px solid var(--glass-border);color:var(--muted);}
.modal-section{margin-bottom:14px;}
.modal-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.modal-content{background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.65;}
.modal-content.hl{border-left:2px solid var(--g1);color:var(--text);font-weight:500;}
.modal-actions{display:flex;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-border);flex-wrap:wrap;}
.btn-modal-primary{font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--g2);color:#060608;border:none;border-radius:var(--r);padding:10px 16px;cursor:pointer;transition:opacity .15s;}
.btn-modal-primary:hover{opacity:.85;}
.btn-modal-del{font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(240,96,96,.1);color:#f06060;border:1px solid rgba(240,96,96,.2);border-radius:var(--r);padding:10px 14px;cursor:pointer;}
.btn-modal-close{font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--glass);color:var(--muted);border:1px solid var(--glass-border);border-radius:var(--r);padding:10px 14px;cursor:pointer;margin-left:auto;}
input[type=date]{background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:9px 12px;font-family:var(--f);font-size:13px;color:var(--text);outline:none;width:100%;transition:border-color .2s;}
input[type=date]:focus{border-color:rgba(80,212,245,.35);}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5);}

/* LOADING */
.loading-state{text-align:center;padding:48px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;}
.spin{width:18px;height:18px;border:2px solid rgba(80,212,245,.1);border-top-color:var(--g2);border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--g2);color:#060608;font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:.05em;padding:10px 20px;border-radius:100px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:200;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:768px){.layout{grid-template-columns:1fr;}.sidebar{position:static;}.cal-stats{grid-template-columns:1fr 1fr;}.cal-day{min-height:70px;}}
@media(max-width:480px){.cal-day{min-height:50px;padding:4px;}.event-chip{font-size:9px;padding:2px 5px;}}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-logo">Criador de Temas Virais</a>
  <div class="topbar-right">
    <span id="user-name" style="font-size:13px;color:var(--muted);"></span>
    <a href="/" class="tl">← Criar</a>
    <a href="/historico" class="tl hist">Histórico</a>
    <a href="/calendario" class="tl active">Calendário</a>
    <a href="/exportar" class="tl" style="color:rgba(240,80,164,.7);border-color:rgba(240,80,164,.2);background:rgba(240,80,164,.04);">↓ PDF</a>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>
</div>

<div class="wrap">
  <div class="cal-header">
    <div>
      <h1 class="cal-title">Calendário <em>Editorial</em></h1>
    </div>
    <div class="cal-nav">
      <button class="btn-nav" onclick="changeMonth(-1)">←</button>
      <span class="cal-month-label" id="month-label">Março 2026</span>
      <button class="btn-nav" onclick="changeMonth(1)">→</button>
      <button class="btn-today" onclick="goToday()">Hoje</button>
    </div>
  </div>

  <div class="cal-stats">
    <div class="cstat"><div class="cstat-label">Agendados</div><div class="cstat-val g2" id="stat-agendados">—</div></div>
    <div class="cstat"><div class="cstat-label">Este mês</div><div class="cstat-val g1" id="stat-mes">—</div></div>
    <div class="cstat"><div class="cstat-label">Reels</div><div class="cstat-val" id="stat-reels">—</div></div>
    <div class="cstat"><div class="cstat-label">Posts + Carrosseis</div><div class="cstat-val" id="stat-outros">—</div></div>
  </div>

  <div id="client-filter-bar" style="display:none;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
  <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Cliente:</span>
  <div id="cal-client-pills" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
</div>
<div class="layout">
    <div>
      <div class="cal-grid" id="cal-grid">
        <div class="loading-state"><div class="spin"></div><span>Carregando calendário...</span></div>
      </div>
    </div>
    <div class="sidebar">
      <div class="sidebar-title">Não agendados</div>
      <p class="sidebar-hint">Arraste um conteúdo para um dia do calendário para agendar.</p>
      <div class="sidebar-items" id="sidebar-items">
        <div class="loading-state" style="padding:16px 0;"><div class="spin"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL='https://ezrhzvrgndvnnslrfxge.supabase.co';
var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cmh6dnJnbmR2bm5zbHJmeGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mzk3MDcsImV4cCI6MjA4OTUxNTcwN30.0m57LLbVHiM8uGml5vYGXfQFwRQllXqyCMzAg8IqzXw';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

var allItems=[], currentDate=new Date(), userId=null, dragItem=null, clienteAtivo='todos';

// ── AUTH ──
(async function(){
  var session=(await sb.auth.getSession()).data.session;
  if(!session){window.location.href='/login.html';return;}
  var prof=(await sb.from('profiles').select('ativo,full_name').eq('id',session.user.id).single()).data;
  if(!prof||!prof.ativo){await sb.auth.signOut();window.location.href='/login.html?pendente=1';return;}
  userId=session.user.id;
  var nm=document.getElementById('user-name');
  if(nm) nm.textContent=prof.full_name||session.user.email;
  await loadData();
})();

async function doLogout(){await sb.auth.signOut();window.location.href='/login.html';}

// ── LOAD ──
async function loadData(){
  var res=await sb.from('historico').select('*').eq('user_id',userId).order('created_at',{ascending:false});
  if(res.error){showToast('Erro ao carregar.');return;}
  allItems=res.data||[];
  updateStats();
  renderCalClientPills();
  renderCalendar();
  renderSidebar();
}

// ── STATS ──
function renderCalClientPills(){
  var clientes=[...new Set(allItems.map(function(i){return i.cliente||'';}).filter(Boolean))];
  var bar=document.getElementById('client-filter-bar');
  var pills=document.getElementById('cal-client-pills');
  if(!clientes.length){if(bar)bar.style.display='none';return;}
  if(bar)bar.style.display='flex';
  if(!pills)return;
  var html='<button class="filter-pill'+(clienteAtivo==='todos'?' active':'')+'" data-c="" onclick="setCalCliente(this)">Todos</button>';
  clientes.forEach(function(cl){
    html+='<button class="filter-pill'+(clienteAtivo===cl?' active':'')+'" data-c="'+cl+'" onclick="setCalCliente(this)">'+cl+'</button>';
  });
  pills.innerHTML=html;
}
function setCalCliente(btn){
  clienteAtivo=btn.getAttribute('data-c')||'todos';
  document.querySelectorAll('#cal-client-pills .filter-pill').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  updateStats();renderCalendar();renderSidebar();
}
function updateStats(){
  var agendados=allItems.filter(function(i){return i.data_publicacao;}).length;
  var hoje=new Date();
  var mesAtual=allItems.filter(function(i){
    if(!i.data_publicacao) return false;
    var d=new Date(i.data_publicacao+'T12:00:00');
    return d.getMonth()===currentDate.getMonth()&&d.getFullYear()===currentDate.getFullYear();
  }).length;
  var reels=allItems.filter(function(i){return i.data_publicacao&&i.formato==='reels';}).length;
  var outros=allItems.filter(function(i){return i.data_publicacao&&i.formato!=='reels';}).length;
  document.getElementById('stat-agendados').textContent=agendados;
  document.getElementById('stat-mes').textContent=mesAtual;
  document.getElementById('stat-reels').textContent=reels;
  document.getElementById('stat-outros').textContent=outros;
}

// ── CALENDAR ──
function changeMonth(dir){
  currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+dir,1);
  updateStats();
  renderCalendar();
}
function goToday(){
  currentDate=new Date();
  updateStats();
  renderCalendar();
}

function renderCalendar(){
  var year=currentDate.getFullYear();
  var month=currentDate.getMonth();
  var months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('month-label').textContent=months[month]+' '+year;

  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var daysInPrev=new Date(year,month,0).getDate();
  var today=new Date();

  // Build events map by date string "YYYY-MM-DD"
  var visItems=clienteAtivo==='todos'?allItems:allItems.filter(function(i){return (i.cliente||'')===clienteAtivo;});
  var evMap={};
  visItems.forEach(function(item){
    if(!item.data_publicacao) return;
    var key=item.data_publicacao.substring(0,10);
    if(!evMap[key]) evMap[key]=[];
    evMap[key].push(item);
  });

  var wdays=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var html='<div class="cal-weekdays">'+wdays.map(function(d){return '<div class="cal-wd">'+d+'</div>';}).join('')+'</div><div class="cal-days">';

  // Prev month days
  for(var i=firstDay-1;i>=0;i--){
    var d=daysInPrev-i;
    html+='<div class="cal-day other-month"><div class="day-num">'+d+'</div></div>';
  }

  // Current month days
  for(var d2=1;d2<=daysInMonth;d2++){
    var isToday=d2===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    var dateStr=year+'-'+(month+1<10?'0':'')+(month+1)+'-'+(d2<10?'0':'')+d2;
    var dayEvents=evMap[dateStr]||[];
    var maxShow=2;
    var evHtml=dayEvents.slice(0,maxShow).map(function(ev){
      var fmtCls='fmt-'+(ev.formato||'post');
      var label=ev.formato==='reels'?'▶':ev.formato==='carrossel'?'☰':'◻';
      return '<div class="event-chip '+fmtCls+'" onclick="openModal(\''+ev.id+'\',event)" title="'+ev.tema+'">'
        +'<span class="chip-dot"></span>'
        +(ev.tema||'').substring(0,18)+(ev.tema&&ev.tema.length>18?'...':'')
        +'</div>';
    }).join('');
    if(dayEvents.length>maxShow){
      evHtml+='<div class="more-chip" onclick="showDayModal(\''+dateStr+'\',event)">+' +(dayEvents.length-maxShow)+' mais</div>';
    }
    html+='<div class="cal-day'+(isToday?' today':'')+'" id="day-'+dateStr+'"'
      +' ondragover="dragOver(event,\''+dateStr+'\')"'
      +' ondragleave="dragLeave(event)"'
      +' ondrop="drop(event,\''+dateStr+'\')">'
      +'<div class="day-num'+(isToday?' today-num':'')+'">'+d2+'</div>'
      +evHtml
      +'</div>';
  }

  // Fill remaining cells
  var total=firstDay+daysInMonth;
  var remaining=(7-total%7)%7;
  for(var r=1;r<=remaining;r++){
    html+='<div class="cal-day other-month"><div class="day-num">'+r+'</div></div>';
  }

  html+='</div>';
  document.getElementById('cal-grid').innerHTML=html;
}

// ── SIDEBAR ──
function renderSidebar(){
  var baseItems=clienteAtivo==='todos'?allItems:allItems.filter(function(i){return (i.cliente||'')===clienteAtivo;});
  var unscheduled=baseItems.filter(function(i){return !i.data_publicacao;});
  var el=document.getElementById('sidebar-items');
  if(!unscheduled.length){
    el.innerHTML='<div class="sidebar-empty">Todos os conteúdos estão agendados! 🎉<br>Gere novos conteúdos para agendar.</div>';
    return;
  }
  el.innerHTML=unscheduled.map(function(item){
    var fmtCls='fmt-'+(item.formato||'post');
    var fmtLabel=item.formato==='reels'?'▶ Reels':item.formato==='carrossel'?'☰ Carrossel':'◻ Post';
    return '<div class="sidebar-item '+fmtCls+'" draggable="true"'
      +' ondragstart="dragStart(event,\''+item.id+'\')"'
      +' ondragend="dragEnd(event)"'
      +' id="si-'+item.id+'">'
      +'<div class="si-fmt">'+fmtLabel+'</div>'
      +'<div class="si-tema">'+(item.tema||'')+'</div>'
      +'<div class="si-nicho">'+(item.nicho||'')+(item.cliente?' · <span style="color:var(--g2);font-weight:700;">'+item.cliente+'</span>':'')+'</div>'
      +'</div>';
  }).join('');
}

// ── DRAG & DROP ──
function dragStart(e,id){
  dragItem=id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
  setTimeout(function(){
    var el=document.getElementById('si-'+id);
    if(el) el.classList.add('dragging');
  },0);
}
function dragEnd(e){
  document.querySelectorAll('.sidebar-item').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.cal-day').forEach(function(el){el.classList.remove('drag-over');});
}
function dragOver(e,dateStr){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var el=document.getElementById('day-'+dateStr);
  if(el) el.classList.add('drag-over');
}
function dragLeave(e){
  if(e.currentTarget) e.currentTarget.classList.remove('drag-over');
}
async function drop(e,dateStr){
  e.preventDefault();
  var id=dragItem||e.dataTransfer.getData('text/plain');
  if(!id) return;
  document.querySelectorAll('.cal-day').forEach(function(el){el.classList.remove('drag-over');});
  await agendarItem(id,dateStr);
}

async function agendarItem(id,dateStr){
  var res=await sb.from('historico').update({data_publicacao:dateStr}).eq('id',id).eq('user_id',userId);
  if(res.error){showToast('Erro ao agendar.');return;}
  var item=allItems.find(function(i){return i.id===id;});
  if(item) item.data_publicacao=dateStr;
  updateStats();
  renderCalClientPills();
  renderCalendar();
  renderSidebar();
  showToast('✓ Agendado para '+formatDate(dateStr));
}

async function desagendarItem(id){
  var res=await sb.from('historico').update({data_publicacao:null}).eq('id',id).eq('user_id',userId);
  if(res.error){showToast('Erro ao remover.');return;}
  var item=allItems.find(function(i){return i.id===id;});
  if(item) item.data_publicacao=null;
  updateStats();
  renderCalClientPills();
  renderCalendar();
  renderSidebar();
  closeModal();
  showToast('Removido do calendário.');
}

// ── MODAL ──
function openModal(id,e){
  if(e) e.stopPropagation();
  var item=allItems.find(function(i){return i.id===id;});
  if(!item) return;
  var c=item.conteudo||{};
  var fmt=item.formato;
  var fmtLabel=fmt==='reels'?'▶ Reels':fmt==='carrossel'?'☰ Carrossel':'◻ Post';
  var dateVal=item.data_publicacao?item.data_publicacao.substring(0,10):'';

  var preview='';
  if(fmt==='reels') preview='<div class="modal-content hl">'+(c.hook||'Sem hook')+'</div>';
  else if(fmt==='carrossel') preview='<div class="modal-content hl">'+(c.capa||'Sem capa')+'</div>';
  else preview='<div class="modal-content hl">'+(c.imagem||'Sem texto')+'</div>';

  var html='<div class="modal-overlay" id="modal-ov" onclick="if(event.target.id===\'modal-ov\')closeModal()">'
    +'<div class="modal">'
    +'<div class="modal-header">'
    +'<div class="modal-title">'+(item.tema||'')+'</div>'
    +'<button class="modal-close" onclick="closeModal()">✕</button>'
    +'</div>'
    +'<div class="modal-meta">'
    +'<span class="modal-tag">'+fmtLabel+'</span>'
    +'<span class="modal-tag">'+(item.nicho||'')+'</span>'
    +'<span class="modal-tag">'+(item.categoria||'')+'</span>'
    +'<span class="modal-tag" style="color:var(--g4)">'+(item.tom||'')+'</span>'
    +'</div>'
    +'<div class="modal-section"><div class="modal-label">Prévia</div>'+preview+'</div>'
    +'<div class="modal-section">'
    +'<div class="modal-label">Data de publicação</div>'
    +'<input type="date" id="modal-date" value="'+dateVal+'" />'
    +'</div>'
    +'<div class="modal-actions">'
    +'<button class="btn-modal-primary" onclick="salvarData(\''+id+'\')">✓ Salvar data</button>'
    +(dateVal?'<button class="btn-modal-del" onclick="desagendarItem(\''+id+'\')">✕ Remover</button>':'')
    +'<button class="btn-modal-close" onclick="closeModal()">Fechar</button>'
    +'</div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

function showDayModal(dateStr,e){
  if(e) e.stopPropagation();
  var dayItems=allItems.filter(function(i){return i.data_publicacao&&i.data_publicacao.substring(0,10)===dateStr;});
  if(!dayItems.length) return;
  var html='<div class="modal-overlay" id="modal-ov" onclick="if(event.target.id===\'modal-ov\')closeModal()">'
    +'<div class="modal">'
    +'<div class="modal-header"><div class="modal-title">'+formatDate(dateStr)+'</div><button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<div style="display:flex;flex-direction:column;gap:8px;">'
    +dayItems.map(function(item){
      var fmtCls='fmt-'+(item.formato||'post');
      var fmtLabel=item.formato==='reels'?'▶ Reels':item.formato==='carrossel'?'☰ Carrossel':'◻ Post';
      return '<div class="sidebar-item '+fmtCls+'" onclick="closeModal();setTimeout(function(){openModal(\''+item.id+'\')},100)" style="cursor:pointer;">'
        +'<div class="si-fmt">'+fmtLabel+'</div>'
        +'<div class="si-tema">'+(item.tema||'')+'</div>'
        +'<div class="si-nicho">'+(item.nicho||'')+(item.cliente?' · <span style="color:var(--g2);font-weight:700;">'+item.cliente+'</span>':'')+'</div>'
        +'</div>';
    }).join('')
    +'</div>'
    +'<div class="modal-actions"><button class="btn-modal-close" onclick="closeModal()">Fechar</button></div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

async function salvarData(id){
  var dateVal=document.getElementById('modal-date').value;
  if(!dateVal){showToast('Escolha uma data.');return;}
  await agendarItem(id,dateVal);
  closeModal();
}

function closeModal(){var m=document.getElementById('modal-ov');if(m)m.remove();}

// ── UTILS ──
function formatDate(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
</script>
</body>
</html>
